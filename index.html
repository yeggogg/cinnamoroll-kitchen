<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🎀 玉桂狗厨房</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e;
  font-family:'PingFang SC','Microsoft YaHei',sans-serif;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
}
#wrap{width:100%;height:100%;display:flex;flex-direction:column;background:#2d1b4e;}
#hud{display:flex;justify-content:space-around;align-items:center;
  padding:8px 4px;background:rgba(0,0,0,0.7);z-index:10;flex-shrink:0;
}
.hud-item{display:flex;align-items:center;gap:4px;color:#fff;font-size:13px;font-weight:700;}
.hud-item .ico{font-size:18px;}
.hud-s{color:#fdcb6e;}.hud-t{color:#a29bfe;}.hud-o{color:#55efc4;}.hud-c{color:#fd79a8;}
#game-area{flex:1;position:relative;overflow:hidden;min-height:0;}
canvas{display:block;width:100%;height:100%;}
#ctrl{position:absolute;bottom:0;left:0;right:0;z-index:20;
  display:flex;justify-content:space-between;align-items:flex-end;
  padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom));
  pointer-events:none;
}
#ctrl>*{pointer-events:auto;}
.dpad{display:grid;grid-template-columns:50px 50px 50px;grid-template-rows:50px 50px 50px;gap:2px;}
.dpad button{width:50px;height:50px;border:none;border-radius:14px;
  background:rgba(255,255,255,0.85);font-size:22px;
  box-shadow:0 2px 8px rgba(0,0,0,0.2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.dpad button:active{background:#fdcb6e;transform:scale(0.88);}
.dpad .gap{background:transparent;box-shadow:none;pointer-events:none;}
#act-btn{width:70px;height:70px;border:none;border-radius:50%;
  background:linear-gradient(135deg,#fd79a8,#e84393);color:#fff;
  font-size:28px;box-shadow:0 4px 16px rgba(232,67,147,0.5);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
#act-btn:active{transform:scale(0.85);}
#overlay{position:absolute;top:0;left:0;right:0;bottom:0;z-index:30;
  display:flex;justify-content:center;align-items:center;
  background:rgba(0,0,0,0.6);pointer-events:none;
}
#overlay.show{pointer-events:all;}
.obox{background:rgba(255,255,255,0.97);border-radius:20px;padding:24px 28px;
  text-align:center;box-shadow:0 10px 40px rgba(0,0,0,0.3);max-width:300px;
}
.obox h2{font-size:22px;margin-bottom:6px;color:#e84393;}
.obox p{font-size:13px;color:#636e72;margin:4px 0;line-height:1.5;}
.obox .btn{display:inline-block;margin-top:14px;padding:12px 32px;
  border:none;border-radius:25px;font-size:17px;font-weight:700;
  background:linear-gradient(135deg,#a29bfe,#6c5ce7);color:#fff;
  box-shadow:0 4px 15px rgba(108,92,231,0.4);cursor:pointer;
}
.obox .btn:active{transform:scale(0.94);}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="hud-item hud-s"><span class="ico">⭐</span><span id="s">0</span></div>
    <div class="hud-item hud-t"><span class="ico">⏱️</span><span id="t">180</span>s</div>
    <div class="hud-item hud-o"><span class="ico">📋</span><span id="o">0</span></div>
    <div class="hud-item hud-c"><span class="ico">🔥</span><span id="c">0</span></div>
  </div>
  <div id="game-area">
    <canvas id="cv"></canvas>
    <div id="ctrl">
      <div class="dpad">
        <button class="gap"></button><button id="bu">▲</button><button class="gap"></button>
        <button id="bl">◀</button><button class="gap"></button><button id="br">▶</button>
        <button class="gap"></button><button id="bd">▼</button><button class="gap"></button>
      </div>
      <button id="act-btn">🖐</button>
    </div>
    <div id="overlay"><div class="obox" id="obox"></div></div>
  </div>
</div>

<script>
(function(){
// ==================== IMAGE LOADING (non-blocking) ====================
const IMG = {};
const imgList = [
  ['bg','assets/kitchen-bg.png'],
  ['cinnamoroll','assets/cinnamoroll.png'],
  ['ingredients','assets/ingredients.png'],
  ['dishes','assets/dishes.png'],
  ['customers','assets/customers.png'],
];
imgList.forEach(([key,src])=>{
  const img = new Image();
  img.onload = ()=>{ IMG[key] = img; };
  img.onerror = ()=>{};
  img.src = src;
});

// ==================== CANVAS ====================
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W,H;

function resize(){
  const area = document.getElementById('game-area');
  const r = area.getBoundingClientRect();
  W = r.width; H = r.height;
  if(W<=0||H<=0){ W=400; H=600; }
  cv.width = W; cv.height = H;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=>{ setTimeout(resize, 200); });

// ==================== STATE ====================
const GS = { MENU:0, PLAY:1, OVER:2 };
let gs = GS.MENU, score=0, orders=0, combo=0, timeLeft=180, ti=null;
let shakeT=0, shakeI=0;

// ==================== INPUT ====================
const K = {};
window.addEventListener('keydown',e=>{K[e.key]=true;e.preventDefault();});
window.addEventListener('keyup',e=>{K[e.key]=false;e.preventDefault();});

['bu','bd','bl','br'].forEach((id,i)=>{
  const b=document.getElementById(id);
  const key=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'][i];
  b.addEventListener('pointerdown',e=>{e.preventDefault();K[key]=true;});
  b.addEventListener('pointerup',e=>{K[key]=false;});
  b.addEventListener('pointerleave',e=>{K[key]=false;});
  b.addEventListener('pointercancel',e=>{K[key]=false;});
});
const actBtn = document.getElementById('act-btn');
actBtn.addEventListener('pointerdown',e=>{e.preventDefault();K[' ']=true;});
actBtn.addEventListener('pointerup',e=>{K[' ']=false;});
actBtn.addEventListener('pointerleave',e=>{K[' ']=false;});

// ==================== PLAYER ====================
const P = { x:0.5, y:0.65, w:40, h:40, spd:0.004, hold:null, face:0, af:0, at:0 };

// ==================== RECIPES ====================
const RECIPES = [
  { id:'sushi', name:'寿司', icon:'🍣', ing:'鱼', proc:'chop', color:'#ff7675', pts:60 },
  { id:'salad', name:'沙拉', icon:'🥗', ing:'蔬菜', proc:'chop', color:'#55efc4', pts:45 },
  { id:'rice', name:'炒饭', icon:'🍚', ing:'米饭', proc:'stove', color:'#ffeaa7', pts:70 },
  { id:'fish', name:'烤鱼', icon:'🐟', ing:'鱼', proc:'stove', color:'#fab1a0', pts:65 },
  { id:'steak', name:'牛排', icon:'🥩', ing:'肉', proc:'stove', color:'#e17055', pts:75 },
  { id:'soup', name:'汤面', icon:'🍜', ing:'蔬菜', proc:'pot', color:'#81ecec', pts:65 },
  { id:'stew', name:'炖肉', icon:'🍲', ing:'肉', proc:'pot', color:'#a29bfe', pts:70 },
];
const INGREDIENTS = ['米饭','蔬菜','鱼','肉'];
const ING_ICON = {'米饭':'🍚','蔬菜':'🥬','鱼':'🐟','肉':'🥩'};
const ING_COLOR = {'米饭':'#fff9e6','蔬菜':'#d4edc9','鱼':'#c8d6e5','肉':'#f8c291'};

// ==================== STATIONS ====================
const STATIONS = [
  { id:'ing', rx:0.10, ry:0.15, w:60, h:60, label:'食材', color:'#ffeaa7', icon:'🥬' },
  { id:'chop', rx:0.35, ry:0.15, w:60, h:60, label:'切菜', color:'#dfe6e9', icon:'🔪' },
  { id:'stove', rx:0.62, ry:0.15, w:60, h:60, label:'炉灶', color:'#fab1a0', icon:'🍳' },
  { id:'pot', rx:0.85, ry:0.50, w:60, h:60, label:'汤锅', color:'#81ecec', icon:'🍲' },
  { id:'serve', rx:0.50, ry:0.80, w:65, h:65, label:'出餐', color:'#a29bfe', icon:'🍽️' },
];

const SS = {
  chop:{busy:false,prog:0,item:null},
  stove:{busy:false,prog:0,item:null},
  pot:{busy:false,prog:0,item:null},
};

// ==================== CUSTOMERS ====================
const CUST_NAMES = ['小猫咪','小兔子','小熊','小企鹅','小仓鼠','小海豹'];
const CUST_ICONS = ['🐱','🐰','🐻','🐧','🐹','🦭'];
let customers=[], spawnT=0;
const MAX_CUST=4, PATIENCE=40;

// ==================== EFFECTS ====================
let parts=[], floats=[];

function spawnParts(x,y,color,n){
  n=n||12;
  for(let i=0;i<n;i++) parts.push({x:x,y:y,vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*3-1.5,life:1,decay:.02+Math.random()*.04,color:color,size:2+Math.random()*3});
}
function spawnFloat(x,y,text,color){
  floats.push({x:x,y:y,text:text,color:color||'#fff',life:1,decay:.018});
}

// ==================== HELPERS ====================
function near(px,py,s){
  var sx=s.rx*W, sy=s.ry*H;
  return Math.abs(px-sx)<(P.w+s.w)/2+4 && Math.abs(py-sy)<(P.h+s.h)/2+4;
}
function getStation(px,py){
  for(var i=0;i<STATIONS.length;i++){ if(near(px,py,STATIONS[i])) return STATIONS[i]; }
  return null;
}

function spawnCust(){
  if(customers.length>=MAX_CUST) return;
  var r=RECIPES[Math.floor(Math.random()*RECIPES.length)];
  var ci=Math.floor(Math.random()*CUST_NAMES.length);
  var rx=0.06+customers.length*0.12;
  customers.push({name:CUST_NAMES[ci],icon:CUST_ICONS[ci],recipe:r,patience:PATIENCE,maxP:PATIENCE,rx:rx,ry:0.88,served:false,leaving:false,leaveA:0});
}

function processStation(id){
  var st=SS[id]; if(!st||!st.busy||!st.item) return;
  st.prog+=0.022;
  if(st.prog>=1){
    st.busy=false;st.prog=0;
    var s=null; for(var i=0;i<STATIONS.length;i++){ if(STATIONS[i].id===id){s=STATIONS[i];break;} }
    if(id==='chop') st.item={type:'chopped',name:st.item.name,icon:'🔪',color:ING_COLOR[st.item.name]};
    else if(id==='stove') st.item={type:'cooked',name:st.item.name,icon:'🍳',color:'#fdcb6e',station:'stove'};
    else if(id==='pot') st.item={type:'cooked',name:st.item.name,icon:'🍲',color:'#81ecec',station:'pot'};
    if(s){ spawnParts(s.rx*W,s.ry*H,'#fdcb6e',15); spawnFloat(s.rx*W,s.ry*H-20,'完成!','#00b894'); }
  }
}

function findRecipe(item){
  if(!item) return null;
  for(var i=0;i<RECIPES.length;i++){
    var r=RECIPES[i];
    if(item.name===r.ing&&((r.proc==='chop'&&item.type==='chopped')||(r.proc==='stove'&&item.type==='cooked'&&item.station==='stove')||(r.proc==='pot'&&item.type==='cooked'&&item.station==='pot'))) return r;
  }
  return null;
}

var actCd=0;
function doAction(){
  if(actCd>0) return;
  actCd=14;
  var st=getStation(P.x,P.y);
  if(!st) return;

  if(st.id==='ing'){
    if(!P.hold){
      var ing=INGREDIENTS[Math.floor(Math.random()*INGREDIENTS.length)];
      P.hold={type:'raw',name:ing,icon:ING_ICON[ing],color:ING_COLOR[ing]};
      spawnParts(st.rx*W,st.ry*H,ING_COLOR[ing],8);
    }
  }else if(st.id==='chop'){
    if(!SS.chop.busy&&P.hold&&P.hold.type==='raw'){
      SS.chop.busy=true;SS.chop.prog=0;SS.chop.item=P.hold;P.hold=null;
      spawnParts(st.rx*W,st.ry*H,'#dfe6e9',8);
    }else if(!SS.chop.busy&&SS.chop.item&&SS.chop.item.type==='chopped'&&!P.hold){
      P.hold=SS.chop.item;SS.chop.item=null;
      spawnParts(st.rx*W,st.ry*H,'#55efc4',8);
    }
  }else if(st.id==='stove'){
    if(!SS.stove.busy&&P.hold&&P.hold.type==='chopped'){
      SS.stove.busy=true;SS.stove.prog=0;SS.stove.item=P.hold;P.hold=null;
      spawnParts(st.rx*W,st.ry*H,'#fab1a0',8);
    }else if(!SS.stove.busy&&SS.stove.item&&SS.stove.item.type==='cooked'&&!P.hold){
      P.hold=SS.stove.item;SS.stove.item=null;
      spawnParts(st.rx*W,st.ry*H,'#fdcb6e',8);
    }
  }else if(st.id==='pot'){
    if(!SS.pot.busy&&P.hold&&P.hold.type==='chopped'){
      SS.pot.busy=true;SS.pot.prog=0;SS.pot.item=P.hold;P.hold=null;
      spawnParts(st.rx*W,st.ry*H,'#81ecec',8);
    }else if(!SS.pot.busy&&SS.pot.item&&SS.pot.item.type==='cooked'&&!P.hold){
      P.hold=SS.pot.item;SS.pot.item=null;
      spawnParts(st.rx*W,st.ry*H,'#fdcb6e',8);
    }
  }else if(st.id==='serve'){
    if(P.hold){
      var recipe=findRecipe(P.hold);
      if(recipe){
        for(var i=0;i<customers.length;i++){
          var cust=customers[i];
          if(cust.served||cust.leaving) continue;
          if(cust.recipe.id===recipe.id){
            cust.served=true;cust.leaving=true;P.hold=null;
            combo++;var bonus=combo>1?combo*5:0;
            score+=recipe.pts+bonus;orders++;
            spawnParts(cust.rx*W,cust.ry*H,'#fdcb6e',25);
            spawnParts(cust.rx*W,cust.ry*H,'#00b894',15);
            spawnFloat(cust.rx*W,cust.ry*H-20,'+'+String(recipe.pts+bonus),'#fdcb6e');
            if(combo>=3) spawnFloat(cust.rx*W,cust.ry*H-40,'🔥'+combo+'连击!','#e84393');
            updateUI();shakeT=8;shakeI=2;break;
          }
        }
      }else{spawnFloat(P.x,P.y-20,'不对!','#e17055');}
    }
  }
}

function updateUI(){
  document.getElementById('s').textContent=score;
  document.getElementById('t').textContent=timeLeft;
  document.getElementById('o').textContent=orders;
  document.getElementById('c').textContent=combo;
}

// ==================== DRAWING ====================
function drawBg(){
  if(IMG.bg&&IMG.bg.complete&&IMG.bg.naturalWidth){
    var iw=IMG.bg.naturalWidth, ih=IMG.bg.naturalHeight;
    var ratio=Math.max(W/iw, H/ih);
    var dw=iw*ratio, dh=ih*ratio;
    ctx.drawImage(IMG.bg, (W-dw)/2, (H-dh)/2, dw, dh);
    ctx.fillStyle='rgba(0,0,0,0.15)';ctx.fillRect(0,0,W,H);
  }else{
    // Fallback: pretty pastel tiles
    var ts=40;
    for(var x=0;x<W;x+=ts){
      for(var y=0;y<H;y+=ts){
        ctx.fillStyle=(Math.floor(x/ts)+Math.floor(y/ts))%2===0?'#fff5f9':'#fce4ec';
        ctx.fillRect(x,y,ts,ts);
      }
    }
  }
}

function drawStation(s){
  var sx=s.rx*W, sy=s.ry*H;
  // Glow
  ctx.fillStyle='rgba(255,255,255,0.3)';ctx.beginPath();
  ctx.roundRect(sx-s.w/2-4,sy-s.h/2-4,s.w+8,s.h+8,16);ctx.fill();
  // Body
  var g=ctx.createLinearGradient(sx-s.w/2,sy-s.h/2,sx+s.w/2,sy+s.h/2);
  g.addColorStop(0,s.color);g.addColorStop(1,'#ffffff');
  ctx.fillStyle=g;ctx.beginPath();
  ctx.roundRect(sx-s.w/2,sy-s.h/2,s.w,s.h,14);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=2;ctx.stroke();
  // Icon
  ctx.font='24px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(s.icon,sx,sy-4);
  // Label
  ctx.font='bold 10px "PingFang SC","Microsoft YaHei",sans-serif';ctx.fillStyle='#2d3436';
  ctx.fillText(s.label,sx,sy+22);
  // Progress
  var ss=SS[s.id];
  if(ss&&ss.busy){
    var bw=s.w-10,bh=5,by=sy+s.h/2-3;
    ctx.fillStyle='rgba(0,0,0,0.15)';ctx.fillRect(sx-bw/2,by,bw,bh);
    ctx.fillStyle='#00b894';ctx.fillRect(sx-bw/2,by,bw*ss.prog,bh);
    if(ss.item){ctx.font='14px serif';ctx.fillStyle='#2d3436';ctx.fillText(ss.item.icon||'?',sx,sy-26);}
  }
  if(ss&&!ss.busy&&ss.item){
    ctx.font='16px serif';ctx.fillStyle='#2d3436';ctx.fillText(ss.item.icon||'✅',sx,sy-26);
    ctx.fillStyle='rgba(253,203,110,0.25)';ctx.beginPath();ctx.arc(sx,sy-24,13,0,Math.PI*2);ctx.fill();
  }
}

function drawPlayer(){
  var p=P;
  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();
  ctx.ellipse(p.x,p.y+p.h/2-2,p.w/2.5,4,0,0,Math.PI*2);ctx.fill();

  if(IMG.cinnamoroll&&IMG.cinnamoroll.complete&&IMG.cinnamoroll.naturalWidth){
    var size=p.w*2.2;
    ctx.drawImage(IMG.cinnamoroll, p.x-size/2, p.y-size/2+2, size, size);
  }else{
    // Fallback: draw cute Cinnamoroll
    var bg=ctx.createRadialGradient(p.x-3,p.y-3,2,p.x,p.y,p.w/2);
    bg.addColorStop(0,'#ffffff');bg.addColorStop(0.8,'#f0e6f6');bg.addColorStop(1,'#e8d5f0');
    ctx.fillStyle=bg;ctx.beginPath();ctx.arc(p.x,p.y-2,p.w/2-2,0,Math.PI*2);ctx.fill();
    // Ears
    ctx.fillStyle='#ffffff';
    ctx.beginPath();ctx.ellipse(p.x-9,p.y-17,7,13,-0.3,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#e8d5f0';ctx.lineWidth=1;ctx.stroke();
    ctx.beginPath();ctx.ellipse(p.x+9,p.y-17,7,13,0.3,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle='#fdcb6e';
    ctx.beginPath();ctx.ellipse(p.x-9,p.y-17,4,9,-0.3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(p.x+9,p.y-17,4,9,0.3,0,Math.PI*2);ctx.fill();
    // Eyes
    ctx.fillStyle='#2d3436';
    ctx.beginPath();ctx.arc(p.x-5,p.y-6,2.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(p.x+5,p.y-6,2.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(p.x-4,p.y-7,1,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(p.x+6,p.y-7,1,0,Math.PI*2);ctx.fill();
    // Mouth
    ctx.strokeStyle='#e17055';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(p.x,p.y-1,3,0.1,Math.PI-0.1);ctx.stroke();
    // Blush
    ctx.fillStyle='rgba(253,121,168,0.4)';
    ctx.beginPath();ctx.arc(p.x-9,p.y-2,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(p.x+9,p.y-2,3,0,Math.PI*2);ctx.fill();
  }

  // Held item
  if(p.hold){
    ctx.fillStyle='rgba(253,203,110,0.35)';ctx.beginPath();
    ctx.arc(p.x,p.y-22,14,0,Math.PI*2);ctx.fill();
    ctx.font='20px serif';ctx.textAlign='center';
    ctx.fillText(p.hold.icon||'📦',p.x,p.y-22);
  }
}

function drawCustomer(c){
  if(c.leaving){c.leaveA+=0.04;if(c.leaveA>=1) return;}
  var alpha=c.leaving?1-c.leaveA:1;
  ctx.globalAlpha=alpha;
  var cx2=c.rx*W, cy2=c.ry*H;

  ctx.fillStyle='rgba(0,0,0,0.15)';ctx.beginPath();
  ctx.ellipse(cx2,cy2+20,16,5,0,0,Math.PI*2);ctx.fill();

  var bg=ctx.createRadialGradient(cx2,cy2-5,3,cx2,cy2,16);
  bg.addColorStop(0,'#ffffff');bg.addColorStop(1,'#ffe0ec');
  ctx.fillStyle=bg;ctx.beginPath();ctx.arc(cx2,cy2,16,0,Math.PI*2);ctx.fill();

  ctx.font='20px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(c.icon,cx2,cy2);

  ctx.fillStyle='rgba(255,255,255,0.95)';
  ctx.strokeStyle=c.recipe.color;ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(cx2-30,cy2-48,60,24,10);ctx.fill();ctx.stroke();
  ctx.fillStyle='#2d3436';ctx.font='11px serif';
  ctx.fillText(c.recipe.icon+' '+c.recipe.name,cx2,cy2-36);

  var bw=30,bh=4,by=cy2+22;
  var ratio=c.patience/c.maxP;
  ctx.fillStyle='rgba(0,0,0,0.12)';ctx.fillRect(cx2-bw/2,by,bw,bh);
  ctx.fillStyle=ratio>0.5?'#00b894':ratio>0.25?'#fdcb6e':'#e17055';
  ctx.fillRect(cx2-bw/2,by,bw*ratio,bh);

  ctx.fillStyle='#636e72';ctx.font='9px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(c.name,cx2,cy2+32);
  ctx.globalAlpha=1;
}

function drawParts(){
  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    ctx.globalAlpha=p.life;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawFloats(){
  for(var i=0;i<floats.length;i++){
    var f=floats[i];
    ctx.globalAlpha=f.life;ctx.fillStyle=f.color;
    ctx.font='bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign='center';ctx.fillText(f.text,f.x,f.y-f.life*18);
  }
  ctx.globalAlpha=1;
}

function drawHUD(){
  if(P.hold){
    var txt='手持: '+(P.hold.icon||'')+' '+P.hold.name;
    var tw=ctx.measureText(txt).width+30;
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.beginPath();
    ctx.roundRect(W-tw-8,6,tw,30,10);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='12px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='right';
    ctx.fillText(txt,W-10,26);
  }
}

function drawOverlay(){
  var overlay=document.getElementById('overlay');
  var obox=document.getElementById('obox');
  if(gs===GS.MENU){
    overlay.classList.add('show');
    obox.innerHTML='<h2>🎀 玉桂狗厨房</h2><p>Cinnamoroll Kitchen</p><p>帮玉桂狗做出客人想要的菜式!</p><p style="font-size:11px;color:#b2bec3;">🥬拿食材 → 🔪切菜 → 🍳/🍲烹饪 → 🍽️上菜</p><button class="btn" onclick="window._startGame()">🎮 开始游戏</button>';
  }else if(gs===GS.OVER){
    overlay.classList.add('show');
    var stars=orders>=8?'⭐⭐⭐':orders>=5?'⭐⭐':'⭐';
    obox.innerHTML='<h2>⏰ 时间到!</h2><p>⭐ 得分: '+score+'</p><p>📋 完成: '+orders+' 单</p><p style="font-size:24px;">'+stars+'</p><button class="btn" onclick="window._startGame()">🔄 再来一局</button>';
  }else{
    overlay.classList.remove('show');
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  var sx=0,sy=0;
  if(shakeT>0){sx=(Math.random()-.5)*shakeI;sy=(Math.random()-.5)*shakeI;}
  ctx.save();ctx.translate(sx,sy);
  drawBg();
  for(var i=0;i<STATIONS.length;i++) drawStation(STATIONS[i]);
  for(var i=0;i<customers.length;i++) drawCustomer(customers[i]);
  drawPlayer();
  drawParts();
  drawFloats();
  drawHUD();
  ctx.restore();
  drawOverlay();
}

// ==================== UPDATE ====================
function update(){
  if(gs!==GS.PLAY) return;

  var dx=0,dy=0;
  if(K['ArrowUp']||K['w']||K['W']) dy=-1;
  if(K['ArrowDown']||K['s']||K['S']) dy=1;
  if(K['ArrowLeft']||K['a']||K['A']) dx=-1;
  if(K['ArrowRight']||K['d']||K['D']) dx=1;
  if(dx&&dy){dx*=.707;dy*=.707;}

  P.x+=dx*P.spd*W;
  P.y+=dy*P.spd*H;
  P.x=Math.max(P.w/2,Math.min(W-P.w/2,P.x));
  P.y=Math.max(P.h/2,Math.min(H-P.h/2,P.y));

  if(K[' ']||K['Space']) doAction();
  if(actCd>0) actCd--;

  processStation('chop');processStation('stove');processStation('pot');

  spawnT++;
  if(spawnT>280){spawnT=0;spawnCust();}

  for(var i=0;i<customers.length;i++){
    var c=customers[i];
    if(!c.served&&!c.leaving){
      c.patience-=.015;
      if(c.patience<=0){c.leaving=true;combo=0;spawnParts(c.rx*W,c.ry*H,'#e17055',10);spawnFloat(c.rx*W,c.ry*H-20,'走了!','#e17055');updateUI();}
    }
  }
  customers=customers.filter(function(c){return c.leaveA<1||!c.leaving;});

  for(var i=0;i<parts.length;i++){var p=parts[i];p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;}
  parts=parts.filter(function(p){return p.life>0;});
  for(var i=0;i<floats.length;i++){var f=floats[i];f.y-=.4;f.life-=f.decay;}
  floats=floats.filter(function(f){return f.life>0;});
  if(shakeT>0) shakeT--;
}

function loop(){update();draw();requestAnimationFrame(loop);}

// ==================== TIMER ====================
function startTimer(){
  ti=setInterval(function(){
    if(gs!==GS.PLAY) return;
    timeLeft--;updateUI();
    if(timeLeft<=0){gs=GS.OVER;clearInterval(ti);updateUI();}
  },1000);
}

// ==================== START ====================
function startGame(){
  resize();
  score=0;orders=0;combo=0;timeLeft=180;
  P.x=W*0.5;P.y=H*0.6;P.hold=null;
  customers=[];parts=[];floats=[];spawnT=0;actCd=0;shakeT=0;
  SS.chop={busy:false,prog:0,item:null};
  SS.stove={busy:false,prog:0,item:null};
  SS.pot={busy:false,prog:0,item:null};
  gs=GS.PLAY;updateUI();
  if(ti) clearInterval(ti);
  startTimer();spawnCust();
}

window._startGame = startGame;

// ==================== INIT ====================
resize();
updateUI();
loop();
})();
</script>
</body>
